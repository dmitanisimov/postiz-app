---
name: Build Custom Postiz Image

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Push the latest tag in addition to tenchat and commit SHA
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dmitanisimov/postiz-app

jobs:
  build-custom-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        env:
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          tags=(
            "-t" "${IMAGE_NAME}:tenchat"
            "-t" "${IMAGE_NAME}:${GITHUB_SHA}"
          )

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            tags+=("-t" "${IMAGE_NAME}:latest")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.dev \
            "${tags[@]}" \
            --build-arg NEXT_PUBLIC_VERSION="${GITHUB_SHA}" \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --push \
            .
